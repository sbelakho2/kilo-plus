name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-lane:
    name: pr-lane (ubuntu, full gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (workspace, all features)
        run: cargo test --workspace --all-features
      - name: Docs (workspace, no deps)
        run: cargo doc --workspace --all-features --no-deps
      - name: Branding scan (source; once per pipeline, not per package)
        run: bash scripts/branding-scan.sh
      - name: Docs drift guard
        run: bash scripts/check-docs-sync.sh
      - name: VS Code extension build
        working-directory: apps/vscode
        run: npm ci && npm run build
      - name: JetBrains split-mode compile + smoke (kotlinc + real daemon)
        # macOS skips this: kotlinc via brew is slow and the wire is
        # platform-independent, so the Ubuntu pass covers it. No Gradle
        # wrapper exists; the repo's own kotlinc driver is used.
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y kotlin
          bash apps/jetbrains/compile-and-smoke.sh

  linux:
    name: cargo gate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doctor smoke
        run: cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci

  macos:
    name: cargo gate (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doctor smoke
        run: cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci

  windows:
    name: cargo gate (windows-latest, core crates)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check (workspace)
        run: cargo check --workspace
      - name: Test (crates without Unix-only FFI)
        run: cargo test -p faktor-core -p faktor-store -p faktor-session -p faktor-context -p faktor-provider -p faktor-security -p faktor-router -p faktor-instructions -p faktor-hooks -p faktor-acp -p faktor-verify

  fuzz-suite:
    name: fuzz + protocol streams (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Streams suite (protocol/provider stream codecs)
        run: cargo test -p faktor-tests-streams

  perf:
    name: perf gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Performance gates ([perf]-ignored tests, release)
        run: cargo test -p faktor-tests-performance --release -- --ignored
