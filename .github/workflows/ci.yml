name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-ubuntu:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Branding gate (no legacy Faktor-brand tokens outside the allowlist)
      run: |
        set -euo pipefail
        ! grep -RniE 'Kilo\+|Kilo Plus|kilo-plus|kilop|kilop-' --include='*.rs' --include='*.toml' --include='*.md' --include='*.yml' --include='*.ts' --include='*.mjs' --include='*.kt' --include='*.json' crates apps tests docs .github README.md Cargo.toml AGENTS.md scripts 2>/dev/null | grep -v '^compat/' | head -20
    - name: Format
        run: cargo fmt --check
      - name: Branding gate (no legacy Faktor-brand tokens outside the allowlist)
      run: |
        set -euo pipefail
        ! grep -RniE 'Kilo\+|Kilo Plus|kilo-plus|kilop|kilop-' --include='*.rs' --include='*.toml' --include='*.md' --include='*.yml' --include='*.ts' --include='*.mjs' --include='*.kt' --include='*.json' crates apps tests docs .github README.md Cargo.toml AGENTS.md scripts 2>/dev/null | grep -v '^compat/' | head -20
    - name: Check
        run: cargo check --workspace
      - name: Branding gate (no legacy Faktor-brand tokens outside the allowlist)
      run: |
        set -euo pipefail
        ! grep -RniE 'Kilo\+|Kilo Plus|kilo-plus|kilop|kilop-' --include='*.rs' --include='*.toml' --include='*.md' --include='*.yml' --include='*.ts' --include='*.mjs' --include='*.kt' --include='*.json' crates apps tests docs .github README.md Cargo.toml AGENTS.md scripts 2>/dev/null | grep -v '^compat/' | head -20
    - name: Docs drift guard
        run: bash scripts/check-docs-sync.sh
      - name: Branding gate (no legacy Faktor-brand tokens outside the allowlist)
      run: |
        set -euo pipefail
        ! grep -RniE 'Kilo\+|Kilo Plus|kilo-plus|kilop|kilop-' --include='*.rs' --include='*.toml' --include='*.md' --include='*.yml' --include='*.ts' --include='*.mjs' --include='*.kt' --include='*.json' crates apps tests docs .github README.md Cargo.toml AGENTS.md scripts 2>/dev/null | grep -v '^compat/' | head -20
    - name: Test (core + persistence, 10 min budget)
        timeout-minutes: 10
        run: |
          echo "running: -p faktor-core -p faktor-protocol -p faktor-cas -p faktor-store -p faktor-session"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p faktor-core -p faktor-protocol -p faktor-cas -p faktor-store -p faktor-session || exit 1
