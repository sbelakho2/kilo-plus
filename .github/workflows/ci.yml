name: CI

# Parallel required lanes (audit 70/90/120): every implemented surface gets
# its own job so a failure names the surface instead of one monolithic
# pr-lane, and the `certification` job aggregates them for branch
# protection. `certification` is the single required status check: it fails
# when any lane failed, was cancelled, or was skipped unexpectedly.
#
# Lane map:
#   rust-linux              fmt + check/test --workspace --all-features + doctor
#   rust-macos              check/test --workspace + doctor (darwin behavior)
#   rust-windows            check --workspace + workspace tests minus the
#                           documented Windows-incompatible targets (below)
#   clippy                  --workspace --all-targets --all-features -D warnings
#   docs                    cargo doc --workspace --all-features --no-deps
#   branding                scripts/branding-scan.sh
#   docs-drift              scripts/check-docs-sync.sh
#   protocol-compat         faktor-protocol + tests/compat + tests/streams
#   vscode-build            npm ci + tsc build + offline extension selftest
#   vscode-visual-with-skip playwright visual gate; recorded skip when the
#                           browser cannot be installed (never a silent pass)
#   jetbrains-build         java 17 + gradle buildPlugin (network allowed)
#   jetbrains-smoke         kotlinc split-mode smokes against a real daemon
#   security-static         static-authority scans + security + seeded fuzz
#   perf-smoke              release [perf]-ignored gates
#   certification           aggregate gate (if: always()) over all of them

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-linux:
    name: rust-linux (ubuntu, fmt + full workspace tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Format
        run: cargo fmt --check
      - name: Check (workspace, all features)
        run: cargo check --workspace --all-features
      - name: Test (workspace, all features; long lanes are #[ignore]-gated)
        run: cargo test --workspace --all-features
      - name: Doctor smoke
        run: cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci

  rust-macos:
    name: rust-macos (macos, check + tests + doctor)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Check (workspace)
        run: cargo check --workspace
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Doctor smoke
        run: cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci

  rust-windows:
    name: rust-windows (windows, workspace tests minus unix-only targets)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Check (workspace; every crate compiles on Windows)
        run: cargo check --workspace
      - name: Test (workspace minus documented unix-only targets)
        # The lane runs the WHOLE workspace except the packages below. Every
        # exclusion is genuinely Windows-incompatible as written (unix-only
        # symbols that fail to compile, or unix-only binaries/shells in
        # un-gated tests); the platform-native crates (faktor-fs,
        # faktor-pty, faktor-terminal, faktor-winjob, tests/static-authority,
        # tests/accounting-modelcheck, tests/router-properties, tests/fault)
        # are all included. A future crate with un-gated unix tests fails
        # this lane by construction until it is fixed or listed here.
        #
        # faktor-cli        test helpers use /bin/sh and std::os::unix::fs::symlink
        # faktor-hooks      tests call libc::kill (unix-only symbol; no Windows binding)
        # faktor-verify     tests call libc::kill + /bin/sh
        # faktor-sandbox    test module imports std::os::unix::fs::symlink
        # faktor-agent      runtime tests spawn unix `sleep`/`sh` without cfg gating
        # faktor-index      cold-cache test spawns unix `sleep` without cfg gating
        # faktor-cas        mtime-advisory tests shell out to `cp -p`/`touch -r`
        # faktor-snapshot   same `cp -p`/`touch -r` mtime-advisory tests
        # faktor-tests-coding-benchmark  verify harness hardcodes /bin/sh + pgrep
        # faktor-tests-fuzz-seeds        supply-chain tests drive bash scripts
        # faktor-tests-performance       orphan probes call /bin/ps; linux-only lane
        run: >-
          cargo test --workspace
          --exclude faktor-cli
          --exclude faktor-hooks
          --exclude faktor-verify
          --exclude faktor-sandbox
          --exclude faktor-agent
          --exclude faktor-index
          --exclude faktor-cas
          --exclude faktor-snapshot
          --exclude faktor-tests-coding-benchmark
          --exclude faktor-tests-fuzz-seeds
          --exclude faktor-tests-performance

  clippy:
    name: clippy (all targets, all features, deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: docs (workspace, no deps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps

  branding:
    name: branding scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden wordmark + metadata scan
        run: bash scripts/branding-scan.sh

  docs-drift:
    name: docs drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Architecture doc drift
        run: bash scripts/check-docs-sync.sh

  protocol-compat:
    name: protocol compat (frozen v756 wire + streams)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Golden protocol, compat fixtures, stream codecs
        run: cargo test -p faktor-protocol -p faktor-tests-compat -p faktor-tests-streams

  vscode-build:
    name: vscode-build (extension build + offline selftest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 23.6 strips TypeScript types natively; the selftest
          # imports the real .ts modules without a bundler.
          node-version: "24"
      - name: Build extension
        working-directory: apps/vscode
        run: npm ci && npm run build
      - name: Offline extension + bridge selftest (no daemon, no network)
        working-directory: apps/vscode
        run: node scripts/selftest.mjs

  vscode-visual-with-skip:
    name: vscode-visual-with-skip (playwright gate, recorded skip)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Vendored-webview visual gate
        # Runs the offline structural/manifest gate always; attempts a
        # playwright + chromium install for the render section and records
        # an explicit skip in ui/kilo-v756-webview/dist/visual-report.json
        # when the browser cannot be installed. A real visual mismatch
        # fails the job; a skip never reports as a pass.
        run: bash scripts/ci-vscode-visual.sh
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-visual-report
          path: ui/kilo-v756-webview/dist/visual-report.json
          if-no-files-found: warn
          retention-days: 14

  jetbrains-build:
    name: jetbrains-build (java 17, gradle buildPlugin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: buildPlugin (IntelliJ Platform module)
        working-directory: apps/jetbrains
        run: ./gradlew :frontend:buildPlugin --no-daemon --stacktrace
      - name: Upload plugin distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: apps/jetbrains/frontend/build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 14

  jetbrains-smoke:
    name: jetbrains-smoke (kotlinc + real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          sudo apt-get update
          sudo apt-get install -y kotlin
      - name: Split-mode compile + wire/native smokes
        run: bash apps/jetbrains/compile-and-smoke.sh

  security-static:
    name: security-static (authority scans + seeded fuzz + supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Static authority scans (spawn/egress/atomic-write invariants)
        run: cargo test -p faktor-tests-static-authority
      - name: Security crate suite
        run: cargo test -p faktor-security
      - name: Seeded fuzz + supply-chain script evidence
        run: cargo test -p faktor-tests-fuzz-seeds

  perf-smoke:
    name: perf-smoke (release [perf]-ignored gates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ runner.os }}
      - name: Performance gates
        run: cargo test -p faktor-tests-performance --release -- --ignored

  certification:
    name: certification (aggregate required gate)
    # Aggregate status check: branch protection can require this single job.
    # `if: always()` makes it run even when a lane failed or was cancelled;
    # it fails unless every required lane returned `success`, so an
    # unexpected `skipped`/`cancelled` cannot masquerade as a pass.
    if: always()
    needs:
      - rust-linux
      - rust-macos
      - rust-windows
      - clippy
      - docs
      - branding
      - docs-drift
      - protocol-compat
      - vscode-build
      - vscode-visual-with-skip
      - jetbrains-build
      - jetbrains-smoke
      - security-static
      - perf-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate lane results into a certification manifest
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = {
              name: entry.get("result", "unknown")
              for name, entry in sorted(needs.items())
          }
          failed = {name: result for name, result in results.items() if result != "success"}

          out_dir = pathlib.Path("target/certification")
          out_dir.mkdir(parents=True, exist_ok=True)
          manifest = {
              "schema": "faktor-ci-certification/v1",
              "commit": os.environ.get("COMMIT_SHA", "unknown"),
              "status": "fail" if failed else "pass",
              "lanes": results,
          }
          (out_dir / "ci-certification.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )

          for name, result in results.items():
              print(f"{result:<10} {name}")
          if failed:
              print(
                  "certification FAILED: "
                  + ", ".join(f"{name}={result}" for name, result in failed.items()),
                  file=sys.stderr,
              )
              sys.exit(1)
          print("certification PASSED: every required lane succeeded")
          PY
      - name: Upload CI certification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-certification-manifest
          path: target/certification/ci-certification.json
          if-no-files-found: warn
          retention-days: 30
