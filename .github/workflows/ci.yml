name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-ubuntu:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --workspace
      - name: Docs drift guard
        run: bash scripts/check-docs-sync.sh
      - name: Test (core + persistence, 10 min budget)
        timeout-minutes: 10
        run: |
          echo "running: -p kilop-core -p kilop-protocol -p kilop-cas -p kilop-store -p kilop-session"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-core -p kilop-protocol -p kilop-cas -p kilop-store -p kilop-session || exit 1
          else
            cargo test -p kilop-core -p kilop-protocol -p kilop-cas -p kilop-store -p kilop-session || exit 1
          fi
          echo "running: -p kilop-context -p kilop-memory -p kilop-scheduler"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-context -p kilop-memory -p kilop-scheduler || exit 1
          else
            cargo test -p kilop-context -p kilop-memory -p kilop-scheduler || exit 1
          fi
      - name: Test (providers, 8 min budget)
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-provider -p kilop-ollama -p kilop-openai -p kilop-anthropic -p kilop-google -p kilop-deepseek -p kilop-gateway"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-provider -p kilop-ollama -p kilop-openai -p kilop-anthropic -p kilop-google -p kilop-deepseek -p kilop-gateway || exit 1
          else
            cargo test -p kilop-provider -p kilop-ollama -p kilop-openai -p kilop-anthropic -p kilop-google -p kilop-deepseek -p kilop-gateway || exit 1
          fi
      - name: "Test (tool crates A: fs/edit/snapshot/sandbox, 8 min budget)"
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-fs -p kilop-edit -p kilop-snapshot -p kilop-sandbox"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-fs -p kilop-edit -p kilop-snapshot -p kilop-sandbox || exit 1
          else
            cargo test -p kilop-fs -p kilop-edit -p kilop-snapshot -p kilop-sandbox || exit 1
          fi
      - name: "Test (tool crate: git, 8 min budget)"
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-git"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-git || exit 1
          else
            cargo test -p kilop-git || exit 1
          fi
      - name: "Test (tool crate: terminal, 8 min budget)"
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-terminal"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-terminal || exit 1
          else
            cargo test -p kilop-terminal || exit 1
          fi
      - name: "Test (tool crates: mcp + lsp, 8 min budget)"
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-mcp -p kilop-lsp"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-mcp -p kilop-lsp || exit 1
          else
            cargo test -p kilop-mcp -p kilop-lsp || exit 1
          fi
      - name: "Test (tool crates: index + search, 8 min budget)"
        timeout-minutes: 8
        run: |
          echo "running: -p kilop-index -p kilop-search"
          if command -v timeout >/dev/null 2>&1; then
            timeout 480s cargo test -p kilop-index -p kilop-search || exit 1
          else
            cargo test -p kilop-index -p kilop-search || exit 1
          fi
      - name: Test (runtime, 10 min budget)
        timeout-minutes: 10
        run: |
          echo "running: -p kilop-agent -p kilop-server -p kilop-cli"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-agent -p kilop-server -p kilop-cli || exit 1
          else
            cargo test -p kilop-agent -p kilop-server -p kilop-cli || exit 1
          fi
      - name: Test (integration + fault, 15 min budget)
        timeout-minutes: 15
        run: |
          echo "running: -p kilop-tests-integration"
          if command -v timeout >/dev/null 2>&1; then
            timeout 900s cargo test -p kilop-tests-integration || exit 1
          else
            cargo test -p kilop-tests-integration || exit 1
          fi
          echo "running: -p kilop-tests-fault"
          if command -v timeout >/dev/null 2>&1; then
            timeout 900s cargo test -p kilop-tests-fault || exit 1
          else
            cargo test -p kilop-tests-fault || exit 1
          fi
      - name: Test (soak/visual/perf quick variants, 10 min budget)
        timeout-minutes: 10
        run: |
          echo "running: -p kilop-tests-soak"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-tests-soak || exit 1
          else
            cargo test -p kilop-tests-soak || exit 1
          fi
          echo "running: -p kilop-tests-visual"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-tests-visual || exit 1
          else
            cargo test -p kilop-tests-visual || exit 1
          fi
          echo "running: -p kilop-tests-performance"
          if command -v timeout >/dev/null 2>&1; then
            timeout 600s cargo test -p kilop-tests-performance || exit 1
          else
            cargo test -p kilop-tests-performance || exit 1
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doctor smoke
        run: cargo run -p kilop-cli -- doctor --data-dir /tmp/kp-ci
      - name: Kilo+ compatibility harness (wire-level; not frozen-client parity)
        timeout-minutes: 5
        run: bash scripts/run-vscode-harness.sh
      - name: JetBrains split-mode smoke (kotlinc + real daemon)
        # macOS job skips this: kotlinc via brew is slow and the wire is
        # platform-independent, so the Ubuntu pass covers it.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y kotlin
          bash apps/jetbrains/compile-and-smoke.sh

