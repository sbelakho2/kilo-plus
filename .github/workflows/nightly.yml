name: Nightly long-running gates

# Fault-injection, soak, and benchmark suites. Deliberately NOT on push:
# they overlap the daily CI cargo gates only where the crates' long,
# ignored variants live (fault containment, the 12-hour-scale soak, and
# the release-mode economy/benchmark lanes). Triggered manually
# (workflow_dispatch) or every night at 04:00 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fault:
    name: "release certification: fault campaign + doctor --deep"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fault suite (crash-mid-write, corruption, zombie, stream death)
        run: cargo test -p faktor-tests-fault -- --nocapture > /tmp/fault.log 2>&1
      - name: Fault log tail
        if: always()
        run: tail -n 200 /tmp/fault.log
      # Release certification (P0-97): after the fault campaign, doctor
      # --deep must pass every audit invariant on a CLEAN data dir (the
      # corruption the campaign proved is contained must not leak into a
      # fresh release image). Failures here gate the release.
      - name: Certification — doctor --deep on a clean data dir
        run: |
          rm -rf /tmp/kp-release-cert
          cargo run -p faktor-cli -- doctor --deep --data-dir /tmp/kp-release-cert

  certify-local-full:
    name: "local certification harness (full profile, offline)"
    # Additive nightly job: runs scripts/certify-local.sh full on the same
    # schedule as the other nightly lanes and uploads the emitted
    # target/certification/manifest.json + per-section logs as an artifact.
    # No network, no provider keys: provider-key real-model runs are
    # recorded as skips inside the manifest by contract.
    #
    # FAST_TESTS_SKIP=1: the workspace test suite is owned by the CI matrix
    # (rust-linux/rust-macos/rust-windows) and re-running it here would
    # double the nightly budget. The skip is recorded honestly in the
    # manifest, so this job certifies the FULL-PROFILE long lanes
    # (release [perf], [fault] at scale, coding-benchmark harness,
    # efficiency harness, ACP interop, release CLI + doctor --deep,
    # static-authority, branding) without claiming a release certificate.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUST_BACKTRACE: "1"
      FAST_TESTS_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full local certification (fast + long lanes)
        run: bash scripts/certify-local.sh full
      - name: Upload certification manifest + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-manifest
          path: target/certification/
          if-no-files-found: warn
          retention-days: 30

  soak:
    name: accelerated 12h-scale simulation (SOAK_SCALE=1)
    # Honest ceiling for the ACCELERATED lane: this job simulates a
    # 12-hour-scale workload with compressed simulated time (P0-74), not a
    # wall-clock 12h run. The previous 180-minute budget belonged to the
    # real-time variant below, which hosted runners must not run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOAK_SCALE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Soak (12h synthetic session, accelerated)
        run: |
          cargo test -p faktor-tests-soak -- --ignored soak_12h_scale --nocapture > /tmp/soak.log 2>&1
          rc=$?
          tail -n 200 /tmp/soak.log
          exit $rc

  # Real-time soak variant (P0-74) — DELIBERATELY DISABLED on hosted
  # runners: a full 12-24h wall-clock soak needs a self-hosted runner
  # (hosted job timeouts cap at ~6h and the billing cost is not justified
  # nightly). To run it: uncomment, move to a self-hosted runner label,
  # and trigger manually — never on the nightly schedule.
  # real-soak:
  #   name: real 12-24h soak (self-hosted runner)
  #   runs-on: [self-hosted, linux, x64]
  #   timeout-minutes: 1560
  #   env:
  #     SOAK_SCALE: "1"
  #     RUST_BACKTRACE: "1"
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
  #     - name: Real 24h wall-clock soak ([soak] 24h test)
  #       run: |
  #         cargo test -p faktor-tests-soak -- --ignored soak_24h --nocapture > /tmp/soak24.log 2>&1
  #         rc=$?
  #         tail -n 200 /tmp/soak24.log
  #         exit $rc

  benchmark:
    name: economy + benchmark lanes (ubuntu-latest, release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Economy suite
        run: cargo test -p faktor-tests-economy --release -- --nocapture > /tmp/economy.log 2>&1
      - name: Benchmark suite
        run: cargo test -p faktor-tests-benchmark --release -- --nocapture > /tmp/bench.log 2>&1
      - name: Log tails
        if: always()
        run: |
          tail -n 100 /tmp/economy.log
          tail -n 100 /tmp/bench.log

  # ---------------------------------------------------------------------------
  # Additive P0-75/P0-81/audit-89/90 lanes.
  # ---------------------------------------------------------------------------

  fuzz:
    name: "coverage-guided fuzz (nightly, bounded budget)"
    # One libFuzzer run per target in fuzz/ for FUZZ_SECONDS_PER_TARGET.
    # When the nightly toolchain (or cargo-fuzz, or its first-build network
    # fetch) is unavailable this job records an explicit SKIP artifact
    # instead of passing silently.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: "1"
      FUZZ_SECONDS_PER_TARGET: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Probe nightly toolchain
        id: toolchain
        run: |
          if rustup run nightly cargo --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: nightly toolchain unavailable; no fuzz budget was run"
          fi
      - name: Install cargo-fuzz
        id: install
        if: steps.toolchain.outputs.available == 'true'
        run: |
          if cargo install cargo-fuzz --locked; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: cargo-fuzz unavailable (network/install failure); no fuzz budget was run"
          fi
      - name: Record the skip honestly
        if: steps.toolchain.outputs.available != 'true' || steps.install.outputs.available != 'true'
        run: |
          mkdir -p target/certification
          printf '{"schema":"faktor-fuzz-skip/1","reason":"nightly toolchain or cargo-fuzz unavailable"}\n' \
            > target/certification/fuzz-skip.json
      - name: Regenerate corpora from the checked-in fixtures
        if: steps.toolchain.outputs.available == 'true' && steps.install.outputs.available == 'true'
        run: bash fuzz/seed-corpus.sh
      - name: Fuzz every target for the budget
        if: steps.toolchain.outputs.available == 'true' && steps.install.outputs.available == 'true'
        working-directory: fuzz
        run: |
          set -u
          status=0
          mkdir -p ../target/certification
          : > ../target/certification/fuzz-status.txt
          for target_file in fuzz_targets/*.rs; do
            target="$(basename "$target_file" .rs)"
            echo "== fuzzing ${target} for ${FUZZ_SECONDS_PER_TARGET}s ==" \
              | tee -a ../target/certification/fuzz-status.txt
            if ! cargo +nightly fuzz run "$target" -- \
                -max_total_time="${FUZZ_SECONDS_PER_TARGET}" \
                -max_len=65536 \
                -rss_limit_mb=4096 \
                -timeout=25 \
                -print_final_stats=1; then
              echo "FUZZ FINDING in ${target}" | tee -a ../target/certification/fuzz-status.txt
              status=1
            fi
          done
          exit "$status"
      - name: Upload fuzz evidence (or the recorded skip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence
          path: |
            target/certification/fuzz-status.txt
            target/certification/fuzz-skip.json
            fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30

  supply-chain:
    name: "supply chain: SBOM + release checksums + advisories"
    # scripts/supply-chain.sh emits target/certification/sbom.json,
    # checksums.txt and supply-chain-status.json. cargo-audit/cargo-deny are
    # attempted (installed below when the network allows); when a tool or its
    # advisory database is unavailable the script records a SKIP in the
    # status JSON and prints it — never a silent pass.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Attempt advisory tool installs (failure is a recorded skip)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked || echo "cargo-audit install failed; the script records the skip"
          cargo install cargo-deny --locked || echo "cargo-deny install failed; the script records the skip"
      - name: Build the release CLI artifact to hash
        run: cargo build -p faktor-cli --release --locked
      - name: SBOM + artifact checksums + advisory attempts
        env:
          SUPPLY_CHAIN_ARTIFACTS: target/release/faktor-cli
        run: bash scripts/supply-chain.sh
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            target/certification/sbom.json
            target/certification/checksums.txt
            target/certification/supply-chain-status.json
            target/certification/logs/
          if-no-files-found: warn
          retention-days: 30

