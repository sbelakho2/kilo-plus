[package]
name = "faktor-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faktor-core.workspace = true
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Same windows-sys 0.61.2 revision the workspace already locks (crates/winjob,
# crates/terminal); the extra feature toggles add no new packages to the lockfile.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
