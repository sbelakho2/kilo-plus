[package]
name = "faktor-semantic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faktor-core = { path = "../core" }
faktor-evidence = { path = "../evidence" }
faktor-provider = { path = "../provider" }
faktor-terminal = { path = "../terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
http = "1"
tokio = { version = "1.53", features = ["time"] }

[dev-dependencies]
faktor-cas = { path = "../cas" }
faktor-security = { path = "../security" }
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
