[package]
name = "faktor-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Durable plan model, child control plane, and economic parallelism policy for multi-agent orchestration"

[dependencies]
faktor-core.workspace = true
faktor-session.workspace = true
faktor-agent.workspace = true
faktor-scheduler.workspace = true
faktor-semantic.workspace = true
tracing.workspace = true
faktor-fs.workspace = true
faktor-git.workspace = true
faktor-instructions.workspace = true
faktor-terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
faktor-provider.workspace = true
faktor-cas.workspace = true
blake3.workspace = true
futures.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Same windows-sys 0.61.2 revision the workspace already locks
# (crates/fs, crates/pty, crates/terminal). Used by shadow_tests.rs to
# create the unprivileged directory-junction fallback directly through
# FSCTL_SET_REPARSE_POINT — no child process (spawn authority stays with
# the ProcessSupervisor).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }
