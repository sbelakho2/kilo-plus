[package]
name = "faktor-winjob"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
tracing.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# tests/windows_tree.rs pid-liveness probes (OpenProcess + WaitForSingleObject).
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }
