[package]
name = "faktor-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
faktor-core.workspace = true
notify = "8"
tokio.workspace = true
blake3.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same windows-sys 0.61.2 revision the workspace already locks
# (crates/pty, crates/terminal, crates/winjob). The Wdk features expose
# NtCreateFile so directory-relative, no-follow component opens are possible.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }
