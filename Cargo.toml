[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/cas",
    "crates/store",
    "crates/session",
    "crates/context",
    "crates/memory",
    "crates/agent",
    "crates/scheduler",
    "crates/provider",
    "crates/ollama",
    "crates/deepseek",
    "crates/openai",
    "crates/anthropic",
    "crates/google",
    "crates/gateway",
    "crates/server",
    "crates/fs",
    "crates/edit",
    "crates/snapshot",
    "crates/git",
    "crates/terminal",
    "crates/pty",
    "crates/winjob",
    "crates/router",
    "crates/instructions",
    "crates/hooks",
    "crates/mcp",
    "crates/lsp",
    "crates/index",
    "crates/search",
    "crates/sandbox",
    "crates/verify",
    "crates/cli",
    "crates/acp",
    "tests/integration",
    "tests/soak",
    "tests/fault",
    "tests/visual",
    "tests/performance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
faktor-core = { path = "crates/core" }
faktor-protocol = { path = "crates/protocol" }
faktor-cas = { path = "crates/cas" }
faktor-store = { path = "crates/store" }
faktor-session = { path = "crates/session" }
faktor-context = { path = "crates/context" }
faktor-memory = { path = "crates/memory" }
faktor-agent = { path = "crates/agent" }
faktor-scheduler = { path = "crates/scheduler" }
faktor-provider = { path = "crates/provider" }
faktor-ollama = { path = "crates/ollama" }
faktor-deepseek = { path = "crates/deepseek" }
faktor-openai = { path = "crates/openai" }
faktor-anthropic = { path = "crates/anthropic" }
faktor-google = { path = "crates/google" }
faktor-gateway = { path = "crates/gateway" }
faktor-server = { path = "crates/server" }
faktor-fs = { path = "crates/fs" }
faktor-edit = { path = "crates/edit" }
faktor-snapshot = { path = "crates/snapshot" }
faktor-git = { path = "crates/git" }
faktor-router = { path = "crates/router" }
faktor-acp = { path = "crates/acp" }
faktor-verify = { path = "crates/verify" }
faktor-instructions = { path = "crates/instructions" }
faktor-hooks = { path = "crates/hooks" }
faktor-pty = { path = "crates/pty" }
faktor-winjob = { path = "crates/winjob" }
faktor-terminal = { path = "crates/terminal" }
faktor-mcp = { path = "crates/mcp" }
faktor-lsp = { path = "crates/lsp" }
faktor-index = { path = "crates/index" }
faktor-search = { path = "crates/search" }
faktor-sandbox = { path = "crates/sandbox" }
faktor-cli = { path = "crates/cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
blake3 = "1.8"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tempfile = "3"
futures-util = "0.3"
tower = "0.5"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 1
