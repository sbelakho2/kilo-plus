[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/cas",
    "crates/store",
    "crates/session",
    "crates/context",
    "crates/memory",
    "crates/agent",
    "crates/scheduler",
    "crates/provider",
    "crates/ollama",
    "crates/deepseek",
    "crates/openai",
    "crates/anthropic",
    "crates/google",
    "crates/gateway",
    "crates/server",
    "crates/fs",
    "crates/edit",
    "crates/snapshot",
    "crates/git",
    "crates/terminal",
    "crates/mcp",
    "crates/lsp",
    "crates/index",
    "crates/search",
    "crates/sandbox",
    "crates/cli",
    "tests/integration",
    "tests/soak",
    "tests/fault",
    "tests/visual",
    "tests/performance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
kilop-core = { path = "crates/core" }
kilop-protocol = { path = "crates/protocol" }
kilop-cas = { path = "crates/cas" }
kilop-store = { path = "crates/store" }
kilop-session = { path = "crates/session" }
kilop-context = { path = "crates/context" }
kilop-memory = { path = "crates/memory" }
kilop-agent = { path = "crates/agent" }
kilop-scheduler = { path = "crates/scheduler" }
kilop-provider = { path = "crates/provider" }
kilop-ollama = { path = "crates/ollama" }
kilop-deepseek = { path = "crates/deepseek" }
kilop-openai = { path = "crates/openai" }
kilop-anthropic = { path = "crates/anthropic" }
kilop-google = { path = "crates/google" }
kilop-gateway = { path = "crates/gateway" }
kilop-server = { path = "crates/server" }
kilop-fs = { path = "crates/fs" }
kilop-edit = { path = "crates/edit" }
kilop-snapshot = { path = "crates/snapshot" }
kilop-git = { path = "crates/git" }
kilop-terminal = { path = "crates/terminal" }
kilop-mcp = { path = "crates/mcp" }
kilop-lsp = { path = "crates/lsp" }
kilop-index = { path = "crates/index" }
kilop-search = { path = "crates/search" }
kilop-sandbox = { path = "crates/sandbox" }
kilop-cli = { path = "crates/cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
blake3 = "1.8"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
tempfile = "3"
futures-util = "0.3"
tower = "0.5"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
